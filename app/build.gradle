apply plugin: 'com.android.application'

// Release signing from local.properties (untracked): signing.storeFile, signing.storePassword, signing.keyAlias,
// signing.keyPassword (defaults to the store password). Without them release APKs stay unsigned.
def localProps = new Properties()
if (rootProject.file('local.properties').exists()) {
    rootProject.file('local.properties').withInputStream { localProps.load(it) }
}

android {
    ndkVersion "27.0.12077973"

    compileSdk 36

    namespace 'com.limelight'

    defaultConfig {
        minSdk 21
        externalNativeBuild {
            ndkBuild {
                arguments "HESTIA_PYROWAVE=" + (project.findProperty("hestiaPyrowave") == "true" ? "1" : "0")
            }
        }
        targetSdk 34

        versionName "20.3.0-beta"
        versionCode = 57

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            resValue "string",
                    "obtainium_app_url",
                    "data:text/html;base64,PGgxPlJvb3QgYnVpbGQgaXMgbm90IGF2YWlsYWJsZTwvaDE+"

            applicationId "local.retroid.athena.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot_game {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            resValue "string",
                    "obtainium_app_url",
                    "https://apps.obtainium.imranr.dev/redirect?r=obtainium://app/%7B%22id%22%3A%22local.retroid.athena%22%2C%22url%22%3A%22https%3A%2F%2Fgithub.com%2Fd3adb5%2Fathena%22%2C%22author%22%3A%22d3adb5%22%2C%22name%22%3A%22Athena%22%2C%22additionalSettings%22%3A%22%7B%5C%22apkFilterRegEx%5C%22%3A%5C%22nonRoot%5C%22%2C%5C%22matchGroupToUse%5C%22%3A%5C%22%241%5C%22%2C%5C%22versionExtractionRegEx%5C%22%3A%5C%22v%28.%2B%29%5C%22%7D%22%7D"

            applicationId "local.retroid.athena"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    packaging {
        resources {
            pickFirsts.add('META-INF/versions/9/OSGI-INF/MANIFEST.MF')
        }
    }

    signingConfigs {
        if (localProps['signing.storeFile']) {
            local {
                storeFile file(localProps['signing.storeFile'])
                storePassword localProps['signing.storePassword']
                keyAlias localProps['signing.keyAlias']
                keyPassword localProps['signing.keyPassword'] ?: localProps['signing.storePassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_label", "Athena Debug"
            resValue "string", "app_label_root", "Athena Debug (Root)"
            resValue "string", "app_label_game", "Athena Debug (Game)"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            // Athena: its own application ID, installing beside Artemis (com.limelight.noir), Artemis RP and Hestia.
            resValue "string", "app_label", "Athena"
            resValue "string", "app_label_root", "Athena (Root)"
            resValue "string", "app_label_game", "Athena (Game)"
            if (signingConfigs.findByName('local')) {
                signingConfig signingConfigs.local
            }

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    // Microphone processing (WebRTC APM), a Meson build of its own; see buildWebrtcApm
    sourceSets.main.jniLibs.srcDirs += layout.buildDirectory.dir('webrtc-apm/libs').get().asFile
    // DeepFilterNet3 noise suppression, a Cargo build; see buildDeepFilter
    sourceSets.main.jniLibs.srcDirs += layout.buildDirectory.dir('deepfilter/libs').get().asFile

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

def buildWebrtcApm = tasks.register('buildWebrtcApm', Exec) {
    commandLine 'bash', file('src/main/webrtc-apm/build.sh').absolutePath,
            android.ndkDirectory.absolutePath, layout.buildDirectory.dir('webrtc-apm').get().asFile.absolutePath
}
def buildDeepFilter = tasks.register('buildDeepFilter', Exec) {
    commandLine 'bash', file('src/main/deepfilter/build.sh').absolutePath,
            android.ndkDirectory.absolutePath, layout.buildDirectory.dir('deepfilter').get().asFile.absolutePath
}
tasks.named('preBuild') { dependsOn buildWebrtcApm, buildDeepFilter }

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.81'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jmdns:jmdns:3.6.1'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.github.ByteHamster:SearchPreference:v2.5.1'

    // Unit test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

