<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432">
  <!-- Athena in profile, as on a Greek coin. 108 dp adaptive canvas at 4x, inside the 66 dp safe circle.
       One colour with cut-outs, so the monochrome layer reads too. -->
  <defs>
    <mask id="cuts">
      <rect width="432" height="432" fill="#fff"/>
      <!-- eye -->
      <path d="M234 209 Q247 200 258 209 Q246 214 234 209 Z" fill="#000"/>
      <path d="M232 197 Q246 188 260 195" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
      <!-- eye-hole of the pushed-back Corinthian helmet -->
      <path d="M218 156 Q234 144 250 154 Q236 166 218 156 Z" fill="#000"/>
      <!-- crest hairs -->
      <path d="M244 98 L238 116 M214 90 L212 108 M184 94 L188 112 M156 108 L166 124 M132 130 L146 142 M112 160 L128 168"
            fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
      <!-- hair strands -->
      <path d="M176 232 Q160 262 172 292 Q178 306 168 318 M196 232 Q184 256 190 284"
            fill="none" stroke="#000" stroke-width="4.5" stroke-linecap="round"/>
    </mask>
  </defs>
  <g mask="url(#cuts)" fill="#E9C46A">
    <!-- crest -->
    <path d="M286 134 Q268 94 216 86 Q150 80 112 130 Q92 166 94 224 L108 220 Q112 176 138 148 Q214 92 280 140 Z"/>
    <!-- dome and visor -->
    <path d="M294 170 L268 172 Q214 180 176 194 Q152 202 144 228 L114 222 Q116 176 144 156 Q214 102 276 148 Q288 158 294 170 Z"/>
    <!-- face and neck -->
    <path d="M264 180 L264 198 L286 234 Q284 239 274 240 Q279 246 276 251 L269 254 Q276 259 272 266 Q266 270 269 278
             Q268 294 250 296 Q238 297 230 290 Q230 314 238 336 Q218 344 204 338 Q210 296 206 262 Q204 236 212 212
             Q222 194 264 180 Z"/>
    <!-- hair -->
    <path d="M202 192 Q168 200 154 232 Q142 268 158 296 Q166 314 146 330 Q176 340 192 322 Q200 296 198 262 Q196 226 208 204 Z"/>
  </g>
</svg>
