<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 432 432">
  <!-- Athena's face from the front, in a crested helmet. 108 dp adaptive canvas at 4x, inside the 66 dp safe circle.
       Parts are separated by gaps and features are cut out, so the monochrome layer reads too. -->
  <defs>
    <g id="half-cuts">
      <!-- eye and iris -->
      <path d="M170 242 Q186 229 205 241 Q187 252 170 242 Z" fill="#000"/>
      <circle cx="188" cy="240.5" r="6.5" fill="#fff"/>
      <!-- brow, running into the nose -->
      <path d="M167 228 Q188 216 208 228 Q210 248 208 266" fill="none" stroke="#000" stroke-width="3.6" stroke-linecap="round"/>
      <!-- crest strands -->
      <path d="M204 92 L202 112 M190 96 L186 116 M176 104 L170 122" fill="none" stroke="#000" stroke-width="3.6" stroke-linecap="round"/>
      <!-- helmet ridge over the brow -->
      <path d="M146 196 Q172 156 216 154" fill="none" stroke="#000" stroke-width="3.6" stroke-linecap="round"/>
      <!-- hair waves -->
      <path d="M146 226 Q132 250 146 272 Q156 290 146 312" fill="none" stroke="#000" stroke-width="3.6" stroke-linecap="round"/>
    </g>
    <mask id="cuts">
      <rect width="432" height="432" fill="#fff"/>
      <use xlink:href="#half-cuts"/>
      <use xlink:href="#half-cuts" transform="translate(432) scale(-1 1)"/>
      <path d="M216 90 L216 110" fill="none" stroke="#000" stroke-width="3.6" stroke-linecap="round"/>
      <!-- nose tip -->
      <path d="M206 268 Q216 276 226 268" fill="none" stroke="#000" stroke-width="3.6" stroke-linecap="round"/>
      <!-- lips -->
      <path d="M200 291 Q209 286 216 288.500 Q223 286 232 291 Q216 301 200 291 Z" fill="#000"/>
      <!-- forehead ornament on the helmet -->
      <path d="M216 128 L224 142 L216 154 L208 142 Z" fill="#000"/>
    </mask>
    <path id="half-hair" d="M152 206 Q120 240 130 284 Q134 310 150 330 Q168 342 182 332 Q190 318 178 300 Q154 264 164 220 Z"/>
  </defs>
  <g mask="url(#cuts)">
    <path fill="#C9973F" d="M190 316 L188 345 Q216 352 244 345 L242 316 Q216 336 190 316 Z"/>
    <g fill="#C9973F">
      <use xlink:href="#half-hair"/>
      <use xlink:href="#half-hair" transform="translate(432) scale(-1 1)"/>
    </g>
    <path fill="#F4DFAE" d="M216 180 Q262 182 268 226 Q270 262 248 298 Q232 319 216 320 Q200 319 184 298 Q162 262 164 226 Q170 182 216 180 Z"/>
    <path fill="#E9C46A" d="M216 84 Q248 86 268 124 Q244 113 216 113 Q188 113 164 124 Q184 86 216 84 Z"/>
    <path fill="#E9C46A" d="M216 120 Q288 122 298 218 L270 214 Q262 176 216 174 Q170 176 162 214 L134 218 Q144 122 216 120 Z"/>
  </g>
</svg>
